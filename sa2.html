<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web_zailyn</title>
</head>
<body style="
margin:0;
height:100vh;
display:flex;
flex-direction:column; 
justify-content:center;
align-items:center;
background-image:url('imagenes/img2.png');
background-size:cover;
background-position:center;
font-family:Arial;
position:relative;
">

<!-- VIDEO CENTRAL -->
<video controls style="
    width:600px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    margin-top: 110px;
    margin-bottom:20px;
">
    <source src="imagenes/video989.mp4" type="video/mp4">
</video>

<!-- BOTÓN POEMA -->
<button onclick="mostrarPoema()" style="
    padding:12px 25px;
    background:#ff69b4;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:15px;
">
💌 Ver poema
</button>

<!-- POEMA -->
<div id="poema" style="
    display:none;
    max-width:400px;
    background:rgba(255,255,255,0.85);
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
">
    Vivo en el limbo pensando en ti,  
    en cada latido que no estás aquí.  
    Y aunque la distancia quiera ganar,  
    mi corazón no deja de amar. ❤️
</div>

<!-- BOTÓN IZQUIERDA -->
<a href="sa3.html" style="
position:absolute;
left:40px;
top:50%;
transform:translateY(-50%);
background:#ff69b4;
padding:10px 20px;
border-radius:10px;
color:white;
text-decoration:none;
">
los ojitos mas preciosos
</a>

<!-- BOTÓN DERECHA -->
<a href="sa4.html" style="
position:absolute;
right:40px;
top:50%;
transform:translateY(-50%);
background:#ff69b4;
padding:10px 20px;
border-radius:10px;
color:white;
text-decoration:none;
">
solo para ti
</a>

<!-- SCRIPT -->
<script>
function mostrarPoema() {
    var p = document.getElementById("poema");
    p.style.display = (p.style.display === "none") ? "block" : "none";
}
</script>

</body>
</html>
