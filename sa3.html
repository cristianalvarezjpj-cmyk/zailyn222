<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>

<style>
body{
    margin:0;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
    text-align:center;
}

.title{
    color:white;
    margin-bottom:10px;
}

.photo-box{
    position:relative;
}

.photo-box img{
    width:100%;
    border-radius:20px;
}

.text-overlay{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,0.4);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:15px;
    border-radius:20px;
    font-size:14px;
}

.footer{
    margin-top:10px;
    color:white;
}
</style>

</head>

<body>

<div class="container">

<div class="title">Para la mujer más especial 💖</div>

<div class="photo-box">
    <img src="imagenes/img5.jpeg">

    <div class="text-overlay">
        En mis largas noches,<br>
        lo único que me abraza<br>
        es tu dulce presencia<br>
        en mi mente 💖
    </div>
</div>

<div class="footer">pa usted nomas</div>

</div>

</body>
</html>
