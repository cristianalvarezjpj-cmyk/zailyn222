<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ti 🎧❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .container {
        text-align: center;
        color: white;
        animation: fadeIn 2s ease;
    }

    .title {
        font-size: 2.5rem;
        margin-bottom: 20px;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
    }

    .audio-box {
        background: rgba(255,255,255,0.1);
        padding: 30px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        display: inline-block;
    }

    audio {
        width: 300px;
        outline: none;
    }

    .message {
        margin-top: 20px;
        font-size: 1.3rem;
        opacity: 0.9;
    }

    /* Corazones flotando */
    .heart {
        position: absolute;
        bottom: -20px;
        font-size: 20px;
        animation: float 6s infinite;
        color: rgba(255,255,255,0.6);
    }

    @keyframes float {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-100vh); opacity: 0; }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

</style>
</head>

<body>

<!-- Corazones -->
<div class="heart" style="left:15%; animation-delay:0s;">❤️</div>
<div class="heart" style="left:40%; animation-delay:2s;">💖</div>
<div class="heart" style="left:65%; animation-delay:4s;">💕</div>
<div class="heart" style="left:85%; animation-delay:1s;">💗</div>

<div class="container">

    <div class="title">Escucha esto… 🎧❤️</div>

    <div class="audio-box">
        <!-- AUDIO -->
        <audio controls>
            <source src="imagenes/sim1.m4a" type="audio/mpeg">
            Tu navegador no soporta audio.
        </audio>
    </div>

    <div class="message">
        Este audio es solo para ti 💖
    </div>

</div>

</body>
</html>
